<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Infrações</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <main class="container my-5" style="max-width: 500px;">
        <div class="card shadow-sm p-4">
            <h1 class="h3 mb-4 text-center">Verificação das Infrações</h1>
            
            <form id="speedForm">
                <div class="mb-3">
                    <label for="inPermitida" class="form-label">Velocidade Permitida</label>
                    <input type="number" class="form-control" id="inPermitida" placeholder="Ex: 80" required>
                </div>

                <div class="mb-3">
                    <label for="inCondutor" class="form-label">Velocidade do Condutor</label>
                    <input type="number" class="form-control" id="inCondutor" placeholder="Ex: 95" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Verificar a Velocidade</button>
            </form>

            <h2 id="tipomulta" class="h5 mt-4 text-center text-secondary"></h2>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./mult.js"></script>
</body>
</html>
